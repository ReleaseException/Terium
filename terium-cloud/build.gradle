plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group 'cloud.terium'
version '1.5-OXYGEN'
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation project(':terium-framework')
    implementation project(':terium-common')
    implementation project(':terium-api')

    implementation 'com.google.code.gson:gson:2.10'
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'org.jline:jline:3.25.0'
    implementation 'org.slf4j:slf4j-simple:2.0.3'
    implementation 'org.fusesource.jansi:jansi:2.4.0'

    implementation 'io.netty:netty-all:4.1.94.Final'
}

shadowJar {
    archiveFileName.set("terium-OXYGEN.jar")
}

jar {
    manifest {
        attributes 'Main-Class': 'cloud.terium.cloudsystem.TeriumCloud'
    }
}